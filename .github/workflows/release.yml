name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package macOS app
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix (for example, v1.2.3 or v1.2.3-rc.1)." >&2
            exit 1
          fi

      - name: Show toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Run tests
        run: swift test

      - name: Build release app bundle
        run: ./script/build_and_run.sh --build-only
        env:
          CONTAINERDESK_BUILD_CONFIGURATION: release

      - name: Create macOS archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          archive="ContainerDesk-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ContainerDesk.app "dist/release/$archive"
          (
            cd dist/release
            shasum -a 256 "$archive" > "$archive.sha256"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="macOS 26+ on Apple silicon. This app bundle is not Developer ID signed or notarized, so Gatekeeper may warn on first launch. See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#macos-gatekeeper) for requirements and opening instructions."
          release_args=(--repo "$GITHUB_REPOSITORY" --title "ContainerDesk $GITHUB_REF_NAME" --notes "$release_notes" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.sha256 "${release_args[@]}"
