name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package macOS app
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix (for example, v1.2.3 or v1.2.3-rc.1)." >&2
            exit 1
          fi

      - name: Show toolchain versions
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          fingerprint="$( { uname -m; xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-

      - name: Run release tests
        run: swift test --configuration release --force-resolved-versions --xunit-output test-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Build release app bundle
        run: ./script/build_and_run.sh --build-only
        env:
          CONTAINERDESK_BUILD_CONFIGURATION: release

      - name: Create macOS archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          archive="ContainerDesk-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ContainerDesk.app "dist/release/$archive"
          disk_image="ContainerDesk-${GITHUB_REF_NAME}-macos-arm64.dmg"
          image_root="$(mktemp -d)"
          trap 'rm -rf "$image_root"' EXIT
          ditto dist/ContainerDesk.app "$image_root/ContainerDesk.app"
          ln -s /Applications "$image_root/Applications"
          hdiutil create -volname "ContainerDesk ${GITHUB_REF_NAME}" -srcfolder "$image_root" -ov -format UDZO "dist/release/$disk_image"
          (
            cd dist/release
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 "$disk_image" > "$disk_image.sha256"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="macOS 26+ on Apple silicon. This app bundle is not Developer ID signed or notarized, so Gatekeeper may warn on first launch. See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#macos-gatekeeper) for requirements and opening instructions."
          release_args=(--repo "$GITHUB_REPOSITORY" --title "ContainerDesk $GITHUB_REF_NAME" --notes "$release_notes" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.dmg release-assets/*.zip release-assets/*.sha256 "${release_args[@]}"
